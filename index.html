<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SellSafeKit — Etsy GPSR Bulk Prep Kit</title>
  <meta name="description" content="Bereite GPSR-relevante Etsy-Listing-Angaben schneller vor: Produktgruppen, Checkliste, Copy-Paste-Text und Bulk-Sheet. Keine Rechtsberatung." />
  <style>
    :root {
      --bg:#fbfaf7;
      --paper:#fff;
      --soft:#f2efe8;
      --ink:#171512;
      --muted:#615d55;
      --line:rgba(23,21,18,.12);
      --green:#2f6b4f;
      --green2:#173b2b;
      --lime:#c9f2b1;
      --blue:#1f5eff;
      --warn:#9b5a16;
      --bad:#9f2f2f;
      --shadow:0 24px 70px rgba(23,21,18,.08),0 2px 12px rgba(23,21,18,.05);
    }

    * { box-sizing:border-box; }

    html { scroll-behavior:smooth; }

    body {
      margin:0;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--ink);
      line-height:1.5;
    }

    a { color:inherit; }

    .wrap {
      max-width:1120px;
      margin:0 auto;
      padding:0 22px;
    }

    .top {
      position:sticky;
      top:0;
      z-index:5;
      background:rgba(251,250,247,.88);
      backdrop-filter:blur(14px);
      border-bottom:1px solid var(--line);
    }

    .nav {
      height:68px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .brand {
      font-weight:850;
      letter-spacing:-.04em;
      font-size:22px;
      text-decoration:none;
    }

    .brand span { color:var(--green); }

    .links {
      display:flex;
      gap:24px;
      align-items:center;
      font-size:14px;
      font-weight:650;
      color:var(--muted);
    }

    .links a { text-decoration:none; }

    .btn {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:46px;
      padding:0 18px;
      border-radius:999px;
      text-decoration:none;
      font-weight:800;
      border:1px solid transparent;
      cursor:pointer;
      transition:.18s transform,.18s background;
    }

    .btn:hover { transform:translateY(-1px); }

    .primary {
      background:var(--green2);
      color:#fff;
    }

    .primary:hover { background:#0f2d20; }

    .secondary {
      background:var(--lime);
      color:#163300;
    }

    .ghost {
      border-color:var(--line);
      background:#fff;
      color:var(--ink);
    }

    .hero {
      padding:86px 0 58px;
    }

    .badge {
      display:inline-flex;
      gap:8px;
      align-items:center;
      border:1px solid var(--line);
      background:#fff;
      border-radius:999px;
      padding:7px 11px;
      font-size:13px;
      font-weight:750;
      color:var(--green2);
    }

    h1 {
      font-size:clamp(46px,7vw,84px);
      line-height:.92;
      letter-spacing:-.065em;
      margin:22px 0 20px;
      max-width:970px;
    }

    h2 {
      font-size:clamp(32px,4vw,54px);
      line-height:.96;
      letter-spacing:-.055em;
      margin:0 0 14px;
    }

    .lead {
      font-size:clamp(18px,2vw,22px);
      max-width:780px;
      color:var(--muted);
      font-weight:480;
    }

    .actions {
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:28px;
    }

    .fine {
      font-size:13px;
      color:var(--muted);
      max-width:760px;
      margin-top:18px;
    }

    .hero-grid {
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:28px;
      align-items:start;
      margin-top:44px;
    }

    .panel {
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .minihead {
      display:flex;
justify-content:space-between;
      gap:12px;
      padding:15px 18px;
      border-bottom:1px solid var(--line);
      font-size:13px;
      color:var(--muted);
      font-weight:700;
    }

    .table { padding:14px; }

    .row {
      display:grid;
      grid-template-columns:1.1fr .75fr .9fr;
      gap:10px;
      align-items:center;
      padding:12px;
      border-bottom:1px solid rgba(23,21,18,.08);
      font-size:14px;
    }

    .row:last-child { border-bottom:0; }

    .status {
      border-radius:999px;
      padding:5px 8px;
      width:max-content;
      font-size:12px;
      font-weight:800;
    }

    .ok {
      background:#e8f7ec;
      color:#17623a;
    }

    .todo {
      background:#fff3d8;
      color:#875100;
    }

    .risk {
      background:#ffe7e2;
      color:#9f2f2f;
    }
    .section {
      padding:72px 0;
    }

    .split {
      display:grid;
      grid-template-columns:.9fr 1.1fr;
      gap:38px;
    }

    .cards {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
    }

    .card {
      background:#fff;
      border:1px solid var(--line);
      border-radius:22px;
      padding:22px;
    }

    .card strong {
      display:block;
      font-size:18px;
      margin-bottom:8px;
      letter-spacing:-.02em;
    }

    .card p {
      margin:0;
      color:var(--muted);
    }

    .soft {
      background:var(--soft);
      border-radius:34px;
      padding:54px;
    }

    .steps {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      counter-reset:step;
    }

    .step {
      background:#fff;
      border:1px solid var(--line);
      border-radius:20px;
      padding:20px;
      counter-increment:step;
    }

    .step:before {
      content:counter(step);
      display:grid;
      place-items:center;
      width:30px;
      height:30px;
      border-radius:50%;
      background:var(--green2);
      color:#fff;
      font-weight:900;
      margin-bottom:16px;
    }

    .checker {
      display:grid;
      grid-template-columns:.8fr 1.2fr;
      gap:20px;
    }

    .form {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    .form label {
      font-size:13px;
      font-weight:800;
      color:#34302a;
      display:grid;
      gap:6px;
    }

    .form input,
    .form select {
      min-height:44px;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      font:inherit;
    }

    .form button {
      grid-column:1/-1;
    }

    .output {
      display:none;
      margin-top:14px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:18px;
    }

    .output.show {
      display:block;
    }

    .kitbox {
      background:var(--green2);
      color:#fff;
      border-radius:34px;
      padding:48px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:28px;
    }

    .kitbox p {
      color:rgba(255,255,255,.76);
    }

    .price {
      font-size:46px;
      font-weight:900;
      letter-spacing:-.04em;
    }

    .kitlist {
      columns:2;
      list-style:none;
      padding:0;
      margin:20px 0;
    }

    .kitlist li {
      break-inside:avoid;
      margin:0 0 10px;
    }

    .kitlist li:before {
      content:'✓ ';
      color:var(--lime);
      font-weight:900;
    }

    .warning {
      background:#fff8e8;
      border:1px solid #efd7a2;
      color:#62400b;
      border-radius:18px;
      padding:16px;
    }

    .faq details {
      background:#fff;
      border-top:1px solid var(--line);
      padding:20px;
    }

    .faq summary {
      font-weight:850;
      cursor:pointer;
    }

    .footer {
      padding:42px 0;
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:14px;
    }

    @media(max-width:850px) {
      .links a:not(.btn) {
        display:none;
      }

      .hero-grid,
      .split,
      .checker,
      .kitbox {
        grid-template-columns:1fr;
      }

      .cards,
      .steps {
        grid-template-columns:1fr;
      }

      .form {
        grid-template-columns:1fr;
      }

      .kitlist {
        columns:1;
      }

      h1 {
        font-size:44px;
      }

      .section {
        padding:48px 0;
      }

      .soft,
      .kitbox {
        padding:28px;
      }
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="wrap nav">
      <a class="brand" href="#top">SellSafe<span>Kit</span></a>
      <div class="links">
        <a href="#workflow">Workflow</a>
        <a href="#check">Gratis Check</a>
        <a href="#kit">Kit</a>
        <a class="btn secondary" href="#waitlist">Warteliste</a>
      </div>
    </div>
  </header>
